x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  apache:
    container_name: apache
    build:
      context: apache
    volumes:
      - ${WWW_DIRECTORY}:/var/www/ips
      - ${LOGS_DIRECTORY}/apache:/usr/local/apache2/logs
      - ${CERTBOT_WWW_DIRECTORY}:/var/www/certbot:ro
      - certificates:/etc/letsencrypt:ro
      - ${BACKUP_DIRECTORY}/www:/var/backup
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      TZ: ${TIMEZONE}
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      php:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  php:
    container_name: php
    build:
      context: php
    volumes:
      - ${WWW_DIRECTORY}:/var/www/ips
      - ${LOGS_DIRECTORY}/php:/usr/local/var/log
    environment:
      TZ: ${TIMEZONE}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  mariadb:
    container_name: mariadb
    build:
      context: mariadb
    volumes:
      - database:/var/lib/mysql
      - ${LOGS_DIRECTORY}/mariadb:/var/log/mysql
      - ${BACKUP_DIRECTORY}/db:/var/backup
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      TZ: ${TIMEZONE}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MARIADB_ROOT_PASSWORD\" mariadb-admin ping -uroot --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  redis:
    container_name: redis
    build:
      context: redis
    volumes:
      - ${LOGS_DIRECTORY}/redis:/var/log/redis
    environment:
      TZ: ${TIMEZONE}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  cron:
    container_name: cron
    build:
      context: cron
    volumes:
      - ${LOGS_DIRECTORY}/cron:/var/log
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      TZ: ${TIMEZONE}
    depends_on:
      socket-proxy:
        condition: service_started
      apache:
        condition: service_healthy
      php:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      restic:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped

  socket-proxy:
    container_name: socket-proxy
    image: tecnativa/docker-socket-proxy:v0.4.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      ALLOW_START: 1
      TZ: ${TIMEZONE}
    logging: *default-logging
    restart: unless-stopped

  logrotate:
    container_name: logrotate
    build:
      context: logrotate
    volumes:
      - ${LOGS_DIRECTORY}:/var/log
    environment:
      TZ: ${TIMEZONE}
    logging: *default-logging

  certbot:
    container_name: certbot
    build:
      context: certbot
    volumes:
      - ${CERTBOT_WWW_DIRECTORY}:/var/www/certbot
      - certificates:/etc/letsencrypt
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      TZ: ${TIMEZONE}
    depends_on:
      - apache
    logging: *default-logging
    restart: unless-stopped

  restic:
    container_name: restic
    build:
      context: restic
    volumes:
      - ${BACKUP_DIRECTORY}:/var/backup
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      TZ: ${TIMEZONE}
    logging: *default-logging
    restart: unless-stopped

volumes:
  database:
  certificates:
