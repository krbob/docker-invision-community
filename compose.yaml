x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-runtime-security: &default-runtime-security
  init: true
  security_opt:
    - no-new-privileges:true

services:
  apache:
    <<: *default-runtime-security
    container_name: apache
    build:
      context: apache
    volumes:
      - ${WWW_DIRECTORY}:/var/www/ips
      - ${LOGS_DIRECTORY}/apache:/usr/local/apache2/logs
      - ${CERTBOT_WWW_DIRECTORY}:/var/www/certbot:ro
      - certificates:/etc/letsencrypt:ro
      - ${BACKUP_DIRECTORY}/www:/var/backup
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TZ: ${TIMEZONE}
    networks:
      - web
      - backend
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      php:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  php:
    <<: *default-runtime-security
    container_name: php
    build:
      context: php
    volumes:
      - ${WWW_DIRECTORY}:/var/www/ips
      - ${LOGS_DIRECTORY}/php:/usr/local/var/log
    environment:
      TZ: ${TIMEZONE}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  mariadb:
    <<: *default-runtime-security
    container_name: mariadb
    build:
      context: mariadb
    volumes:
      - database:/var/lib/mysql
      - ${LOGS_DIRECTORY}/mariadb:/var/log/mysql
      - ${BACKUP_DIRECTORY}/db:/var/backup
    secrets:
      - mariadb_root_password
      - mariadb_password
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
      TZ: ${TIMEZONE}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/mariadb_root_password)\" mariadb-admin ping -uroot --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  redis:
    <<: *default-runtime-security
    container_name: redis
    build:
      context: redis
    volumes:
      - ${LOGS_DIRECTORY}/redis:/var/log/redis
    environment:
      TZ: ${TIMEZONE}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  cron:
    <<: *default-runtime-security
    container_name: cron
    build:
      context: cron
    volumes:
      - ${LOGS_DIRECTORY}/cron:/var/log
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      TZ: ${TIMEZONE}
    networks:
      - automation
    depends_on:
      socket-proxy:
        condition: service_started
      apache:
        condition: service_healthy
      php:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      restic:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped

  socket-proxy:
    <<: *default-runtime-security
    container_name: socket-proxy
    # renovate: datasource=docker depName=tecnativa/docker-socket-proxy
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      ALLOW_START: 1
      TZ: ${TIMEZONE}
    networks:
      - automation
    logging: *default-logging
    restart: unless-stopped

  logrotate:
    <<: *default-runtime-security
    container_name: logrotate
    build:
      context: logrotate
    volumes:
      - ${LOGS_DIRECTORY}:/var/log
    environment:
      TZ: ${TIMEZONE}
    network_mode: none
    logging: *default-logging

  certbot:
    <<: *default-runtime-security
    container_name: certbot
    build:
      context: certbot
    volumes:
      - ${CERTBOT_WWW_DIRECTORY}:/var/www/certbot
      - certificates:/etc/letsencrypt
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      TZ: ${TIMEZONE}
    networks:
      - egress
    depends_on:
      - apache
    logging: *default-logging
    restart: unless-stopped

  restic:
    <<: *default-runtime-security
    container_name: restic
    build:
      context: restic
    volumes:
      - ${BACKUP_DIRECTORY}:/var/backup
    secrets:
      - restic_password
      - aws_credentials
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_CREDENTIALS_FILE: /run/secrets/aws_credentials
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      TZ: ${TIMEZONE}
    networks:
      - egress
    logging: *default-logging
    restart: unless-stopped

volumes:
  database:
  certificates:

secrets:
  mariadb_root_password:
    file: ${SECRETS_DIRECTORY}/mariadb_root_password
  mariadb_password:
    file: ${SECRETS_DIRECTORY}/mariadb_password
  restic_password:
    file: ${SECRETS_DIRECTORY}/restic_password
  aws_credentials:
    file: ${SECRETS_DIRECTORY}/aws_credentials

networks:
  web:
  backend:
    internal: true
  automation:
    internal: true
  egress:
